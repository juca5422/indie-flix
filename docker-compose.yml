services:
  db:
    image: postgres:18-alpine
    container_name: indieflix-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: indieflix
      POSTGRES_PASSWORD: buebue
      POSTGRES_DB: indieflix
    ports:
      - "5432:5432"
    volumes:
      - indieflix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indieflix -d indieflix"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  indieflix_pgdata:
